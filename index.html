<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Hangman Quiz - Programming Languages</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SCREEN 1: LANGUAGE SELECTION -->
    <div class="screen language-screen" id="languageScreen">
        <div class="screen-content">
            <h1 class="game-main-title">HANGMAN</h1>
            <img src="Gemini_Generated_Image_rhj8gkrhj8gkrhj8.png" alt="Hangman Logo" class="game-logo">
            <div class="card-container">
                <div class="language-cards">
                    <button class="lang-card" data-lang="java">
                        <div class="lang-icon"><i class='bx bxl-java'></i></div>
                        <div class="lang-name">Java</div>
                    </button>
                    <button class="lang-card" data-lang="csharp">
                        <div class="lang-icon"><i class='bx bxl-c-sharp'></i></div>
                        <div class="lang-name">C#</div>
                    </button>
                    <button class="lang-card" data-lang="webdev">
                        <div class="lang-icon"><i class='bx bx-code-alt'></i></div>
                        <div class="lang-name">Web Dev</div>
                    </button>
                    <button class="lang-card" data-lang="python">
                        <div class="lang-icon"><i class='bx bxl-python'></i></div>
                        <div class="lang-name">Python</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: LEVEL SELECTION -->
    <div class="screen level-screen" id="levelScreen" style="display: none;">
        <div class="screen-content">
            <button class="back-btn" id="backToLangBtn">
                <i class='bx bx-arrow-back'></i>
            </button>
            <h1 class="game-main-title">HANGMAN</h1>
            <div class="selected-lang-display" id="selectedLangDisplay">
                <i class='bx' id="selectedLangIconLevel"></i>
                <span id="selectedLangNameLevel">Java</span>
            </div>
            <div class="level-cards">
                <button class="level-card" data-level="1">
                    <div class="level-icon">⭐</div>
                    <div class="level-name">Easy</div>
                    <div class="level-points">+1 point</div>
                </button>
                <button class="level-card" data-level="2">
                    <div class="level-icon">⭐⭐</div>
                    <div class="level-name">Medium</div>
                    <div class="level-points">+2 points</div>
                </button>
                <button class="level-card" data-level="3">
                    <div class="level-icon">⭐⭐⭐</div>
                    <div class="level-name">Hard</div>
                    <div class="level-points">+3 points</div>
                </button>
                <button class="level-card" data-level="4">
                    <div class="level-icon">⭐⭐⭐⭐</div>
                    <div class="level-name">Expert</div>
                    <div class="level-points">+4 points</div>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: GAME SCREEN - WALANG BACK BUTTON -->
    <div class="screen game-screen" id="gameScreen" style="display: none;">
        <div class="game-container">
            <!-- INAALIS ANG BACK BUTTON DITO -->
            
            <div class="game-header">
                <!-- Level indicator button - pwedeng i-click para bumalik sa level selection -->
                <button class="level-indicator-btn" id="levelIndicatorBtn">Level 1 - Easy</button>
                <div class="points-indicator">
                    <i class='bx bx-star'></i>
                    <span id="totalPoints">0</span>
                </div>
            </div>
            <h1 class="game-title">HANGMAN</h1>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-label">PERFECT</div>
                    <div class="stat-value" id="perfectCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">STREAK</div>
                    <div class="stat-value" id="streakCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">MAX</div>
                    <div class="stat-value" id="maxStreak">0</div>
                </div>
            </div>
            <div class="score-animation-small" id="scoreAnimation">+100</div>
            <div class="hangman-hearts-row">
                <div class="hangman-wrapper">
                    <div class="hangman-svg">
                        <svg viewBox="0 0 200 250">
                            <line x1="40" y1="240" x2="160" y2="240" class="stroke"/>
                            <line x1="100" y1="240" x2="100" y2="40" class="stroke"/>
                            <line x1="100" y1="40" x2="140" y2="40" class="stroke"/>
                            <line x1="140" y1="40" x2="140" y2="70" class="stroke"/>
                            <circle id="head" cx="140" cy="90" r="20" class="stroke" fill="none" style="display: none;"/>
                            <line id="body" x1="140" y1="110" x2="140" y2="170" class="stroke" style="display: none;"/>
                            <line id="leftArm" x1="140" y1="130" x2="120" y2="150" class="stroke" style="display: none;"/>
                            <line id="rightArm" x1="140" y1="130" x2="160" y2="150" class="stroke" style="display: none;"/>
                            <line id="leftLeg" x1="140" y1="170" x2="120" y2="200" class="stroke" style="display: none;"/>
                            <line id="rightLeg" x1="140" y1="170" x2="160" y2="200" class="stroke" style="display: none;"/>
                        </svg>
                    </div>
                </div>
                <div class="health-side">
                    <div class="heart-multiplier">
                        <i class='bx bxs-heart'></i> x<span id="healthCount">6</span>
                    </div>
                </div>
            </div>
            <div class="question-container">
                <div class="question-text" id="question"></div>
                <div class="hint-text" id="hint"></div>
            </div>
            <div class="word-container">
                <div class="word-display" id="wordDisplay"></div>
            </div>
            <div class="keyboard" id="keyboard"></div>
        </div>
    </div>

    <!-- WELL DONE MODAL -->
    <div id="wellDoneModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: white; border-radius: 30px; padding: 30px; text-align: center; max-width: 320px; width: 90%;">
            <h2 style="font-size: 1.8rem; color: #333; margin-bottom: 20px;">🎉 WELL DONE!</h2>
            <div style="background: #f0f0f0; border-radius: 15px; padding: 15px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Points Earned:</span><span style="font-weight: bold; color: #333;" id="modalPointsEarned">0</span></div>
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Total Points:</span><span style="font-weight: bold; color: #333;" id="modalTotalPoints">0</span></div>
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Perfect:</span><span style="font-weight: bold; color: #333;" id="modalPerfect">0</span></div>
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Streak:</span><span style="font-weight: bold; color: #333;" id="modalStreak">0</span></div>
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Max Streak:</span><span style="font-weight: bold; color: #333;" id="modalMaxStreak">0</span></div>
            </div>
            <button id="nextWordBtn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer;">NEXT QUESTION →</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="gameOverModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 9999;">
        <div style="background: white; border-radius: 30px; padding: 30px; text-align: center; max-width: 320px; width: 90%;">
            <h2 style="font-size: 1.8rem; color: #333; margin-bottom: 20px;">😢 GAME OVER</h2>
            <div style="background: #f0f0f0; border-radius: 15px; padding: 15px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">The word was:</span><span style="font-weight: bold; color: #333;" id="gameOverWord"></span></div>
                <div style="display: flex; justify-content: space-between; margin: 8px 0;"><span style="color: #888;">Total Points:</span><span style="font-weight: bold; color: #333;" id="gameOverTotalPoints">0</span></div>
            </div>
            <button id="gameOverRetryBtn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer;">TRY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
